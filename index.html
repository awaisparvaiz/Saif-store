
<style>
.slider-section{
  padding:25px 12px;
  background:#101010;
  color:white;
}
.slider-title{
  color:#d8b65c;
  text-align:center;
  letter-spacing:2px;
}
.slider-wrap{
  position:relative;
  display:flex;
  align-items:center;
}
.product-slider{
  display:flex;
  gap:15px;
  overflow-x:auto;
  scroll-behavior:smooth;
  scrollbar-width:none;
  padding:15px 5px;
  width:100%;
}
.product-slider::-webkit-scrollbar{display:none}
.slide-card{
  flex:0 0 180px;
  background:#202020;
  border:1px solid #806b38;
  border-radius:12px;
  overflow:hidden;
  text-align:center;
  padding-bottom:15px;
}
.slide-card img{
  width:100%;
  height:165px;
  object-fit:cover;
}
.slide-card h3{font-size:15px}
.slide-price{
  color:#e5c66a;
  font-weight:bold;
}
.slide-card button{
  background:#d8b65c;
  color:#111;
  border:0;
  padding:10px;
  border-radius:5px;
  cursor:pointer;
}
.slide-arrow{
  background:#d8b65c;
  color:#111;
  border:0;
  border-radius:50%;
  width:38px;
  height:38px;
  font-size:22px;
  cursor:pointer;
  flex-shrink:0;
}
@media(max-width:450px){
  .slide-card{flex-basis:155px}
}
</style>

<section class="slider-section">
<h2 class="slider-title">OUR COLLECTION</h2>

<div class="slider-wrap">
<button class="slide-arrow" onclick="moveProducts(-1)">‹</button>

<div class="product-slider" id="productSlider">

<div class="slide-card">
<img src="https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=500" alt="Black Cap">
<h3>Black Cap</h3>
<p class="slide-price">Rs. 800</p>
<button onclick="add('Black Cap')">ADD TO BAG</button>
</div>

<div class="slide-card">
<img src="https://images.unsplash.com/photo-1521369909029-2afed882baee?w=500" alt="Baseball Cap">
<h3>Baseball Cap</h3>
<p class="slide-price">Rs. 1000</p>
<button onclick="add('Baseball Cap')">ADD TO BAG</button>
</div>

<div class="slide-card">
<img src="https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=500" alt="Hoodie">
<h3>Premium Hoodie</h3>
<p class="slide-price">Rs. 2500</p>
<button onclick="add('Premium Hoodie')">ADD TO BAG</button>
</div>

<div class="slide-card">
<img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500" alt="T Shirt">
<h3>T-Shirt</h3>
<p class="slide-price">Rs. 1200</p>
<button onclick="add('T-Shirt')">ADD TO BAG</button>
</div>

<div class="slide-card">
<img src="https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=500" alt="Sunglasses">
<h3>Sunglasses</h3>
<p class="slide-price">Rs. 1500</p>
<button onclick="add('Sunglasses')">ADD TO BAG</button>
</div>

<div class="slide-card">
<img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" alt="Smart Watch">
<h3>Smart Watch</h3>
<p class="slide-price">Rs. 3500</p>
<button onclick="add('Smart Watch')">ADD TO BAG</button>
</div>

<div class="slide-card">
<img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" alt="Headphones">
<h3>Headphones</h3>
<p class="slide-price">Rs. 2500</p>
<button onclick="add('Headphones')">ADD TO BAG</button>
</div>

<div class="slide-card">
<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" alt="Shoes">
<h3>Shoes</h3>
<p class="slide-price">Rs. 3000</p>
<button onclick="add('Shoes')">ADD TO BAG</button>
</div>

</div>

<button class="slide-arrow" onclick="moveProducts(1)">›</button>
</div>
</section>

<script>
function moveProducts(direction){
  document.getElementById("productSlider").scrollBy({
    left:direction*350,
    behavior:"smooth"
  });
}
                                         </script>
