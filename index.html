
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AS STORE</title>
<style>
body{font-family:Arial;margin:0;background:#f4f4f4;color:#222}
header{background:#111;color:white;text-align:center;padding:22px}
h1{margin:0;color:gold}
.container{padding:15px;max-width:1000px;margin:auto}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px}
.product,.cart{background:white;padding:14px;border-radius:12px;text-align:center;box-shadow:0 2px 8px #ddd}
.product .emoji{font-size:55px}
button{background:#111;color:white;border:0;padding:10px 14px;border-radius:7px;cursor:pointer;margin:4px}
button:hover{background:#b8860b}
.cart{margin-top:25px;text-align:left}
input,select{padding:12px;width:95%;margin:7px 0;border:1px solid #ccc;border-radius:7px}
.price{color:#087a36;font-weight:bold}
</style>
</head>
<body>

<header>
<h1>AS STORE</h1>
<p>Quality Products | Best Prices</p>
</header>

<div class="container">
<h2>Our Products</h2>
<div class="products" id="products"></div>

<div class="cart">
<h2>🛒 Shopping Bag</h2>
<div id="cart"></div>
<h3 id="total">Total: Rs. 0</h3>

<h3>Customer Details</h3>
<input id="customer" placeholder="Your Name">
<input id="phone" placeholder="Phone Number">
<input id="address" placeholder="Delivery Address">

<h3>Payment Method</h3>
<select id="payment">
<option>JazzCash</option>
<option>Easypaisa</option>
</select>

<button onclick="checkout()">Generate Bill & Order</button>
<div id="bill"></div>
</div>
</div>

<script>
const products=[
{name:"Black Cap",price:800,emoji:"🧢"},
{name:"Baseball Cap",price:1000,emoji:"🧢"},
{name:"Premium Hoodie",price:2500,emoji:"👕"},
{name:"T-Shirt",price:1200,emoji:"👕"},
{name:"Wallet",price:1200,emoji:"👛"},
{name:"Sunglasses",price:1500,emoji:"🕶️"},
{name:"Smart Watch",price:3500,emoji:"⌚"},
{name:"Headphones",price:2500,emoji:"🎧"},
{name:"Shoes",price:3000,emoji:"👟"}
];

let bag=[];

function showProducts(){
document.getElementById("products").innerHTML=products.map((p,i)=>`
<div class="product">
<div class="emoji">${p.emoji}</div>
<h3>${p.name}</h3>
<p class="price">Rs. ${p.price}</p>
<button onclick="add(${i})">Add to Bag</button>
</div>`).join("");
}

function add(i){
let item=bag.find(x=>x.name===products[i].name);
if(item)item.qty++;
else bag.push({...products[i],qty:1});
showCart();
}

function change(i,n){
bag[i].qty+=n;
if(bag[i].qty<=0)bag.splice(i,1);
showCart();
}

function showCart(){
let total=bag.reduce((s,p)=>s+p.price*p.qty,0);
document.getElementById("cart").innerHTML=bag.length?
bag.map((p,i)=>`
<p>${p.name} - Rs. ${p.price}
<button onclick="change(${i},-1)">−</button>
${p.qty}
<button onclick="change(${i},1)">+</button>
</p>`).join(""):"Your bag is empty";
document.getElementById("total").innerText="Total: Rs. "+total;
}

function checkout(){
if(!bag.length){alert("Please add a product first");return;}
let name=document.getElementById("customer").value.trim();
let phone=document.getElementById("phone").value.trim();
let address=document.getElementById("address").value.trim();
let payment=document.getElementById("payment").value;
if(!name||!phone||!address){alert("Please fill all customer details");return;}

let subtotal=bag.reduce((s,p)=>s+p.price*p.qty,0);
let delivery=200;
let total=subtotal+delivery;

let lines=bag.map(p=>`${p.name} x ${p.qty} = Rs. ${p.price*p.qty}`).join("\n");
let bill=`AS STORE INVOICE\n\nCustomer: ${name}\nPhone: ${phone}\nAddress: ${address}\n\n${lines}\n\nSubtotal: Rs. ${subtotal}\nDelivery: Rs. ${delivery}\nTOTAL: Rs. ${total}\nPayment: ${payment}`;

document.getElementById("bill").innerHTML=`
<hr><h2>AS STORE BILL</h2>
<p>Customer: ${escapeHTML(name)}</p>
<p>Phone: ${escapeHTML(phone)}</p>
<p>Address: ${escapeHTML(address)}</p>
<p>${bag.map(p=>escapeHTML(p.name)+" x "+p.qty+" = Rs. "+p.price*p.qty).join("<br>")}</p>
<p>Subtotal: Rs. ${subtotal}</p>
<p>Delivery: Rs. ${delivery}</p>
<h2>Total: Rs. ${total}</h2>
<p>Payment: ${payment}</p>
<button onclick="window.print()">Print / Save Bill</button>
<button onclick="sendWhatsApp()">Send Order on WhatsApp</button>`;

window.currentBill=bill;
}

function escapeHTML(s){
return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function sendWhatsApp(){
window.open("https://wa.me/923290030892?text="+encodeURIComponent(window.currentBill)," _blank");
}

showProducts();
showCart();
</script>
</body>
  </html>
